    <!-- Main Content Container -->
    <main class="container" style="padding-top: 140px; min-height: 80vh;">
        
        <!-- Portfolio Section -->
        <section id="portfolio-completo" style="border-bottom: none; padding-top: 20px;">
            <div class="section-header">
                <h1 class="section-title">Portafolio de Sistemas</h1>
                <span class="section-num">ENGINEERED_SYSTEMS</span>
            </div>

            <!-- Categories Tabs -->
            <div class="portfolio-filters reveal delay-1">
                <button class="filter-btn active" data-filter="all">Todos</button>
                <button class="filter-btn" data-filter="web">Sistemas Web</button>
                <button class="filter-btn" data-filter="mobile">Aplicaciones Móviles</button>
                <button class="filter-btn" data-filter="games">Videojuegos 2D</button>
            </div>
            
            <!-- Grid target of portfolio.js -->
            <div class="grid-3" id="full-portfolio-grid">
                <div style="grid-column: 1 / -1; text-align: center; color: var(--text-secondary); padding: 40px;">
                    Cargando repositorio de sistemas...
                </div>
            </div>
        </section>
        
    </main>

    <!-- Portfolio Captures Modal Viewer -->
    <div id="portfolio-modal" class="custom-modal">
        <div class="modal-container">
            <div class="modal-carousel-viewport">
                <button class="modal-close" onclick="closeModal('portfolio-modal')" aria-label="Cerrar modal">&times;</button>
                <button class="modal-nav prev" id="modal-prev" aria-label="Anterior">&lsaquo;</button>
                <img id="modal-img" src="" alt="Captura de sistema desarrollado por SevenZone" />
                <button class="modal-nav next" id="modal-next" aria-label="Siguiente">&rsaquo;</button>
            </div>
            <div class="modal-indicator" id="modal-indicator"></div>
            <div class="modal-info">
                <h3 id="modal-title"></h3>
                <div id="modal-desc"></div>
                <div class="modal-meta">
                    <span id="modal-category"></span>
                    <span id="modal-tech"></span>
                </div>
            </div>
        </div>
    </div>
